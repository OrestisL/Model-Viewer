name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
env:
  # Headers, loader and glslang are all tagged together by Khronos.
  VULKAN_TAG: vulkan-sdk-1.4.357.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # GLFW needs the X11 and Wayland development headers; the Vulkan loader
      # and glslang come from the distribution rather than the LunarG SDK,
      # which is enough to build and is considerably faster to install.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libvulkan-dev vulkan-validationlayers glslang-tools spirv-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # Dependencies are fetched at configure time, so caching _deps turns a
      # ~20 minute build into a couple of minutes on unchanged pins.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/linux-dist/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset linux-dist

      - name: Build
        run: cmake --build --preset linux-dist

      - name: Package
        working-directory: build/linux-dist
        run: cpack

      - uses: actions/upload-artifact@v7
        with:
          name: ModelViewer-linux-x86_64
          path: build/linux-dist/ModelViewer-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Vulkan from Khronos sources rather than the LunarG SDK.
      #
      # The setup-vulkan-sdk action builds glslang with ENABLE_OPT left at its
      # default of ON, which requires SPIRV-Tools -- and the action never
      # fetches them, so its configure step fails outright. Building the three
      # pieces here is explicit, cacheable, comes entirely from Khronos, and
      # avoids a 1 GB installer for the handful of files actually needed:
      # headers, vulkan-1.lib to link against, and a GLSL compiler.
      - name: Cache Vulkan
        id: vulkan-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vulkan
          key: vulkan-${{ env.VULKAN_TAG }}-windows

      - name: Build Vulkan headers, loader and glslang
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $prefix = "${{ github.workspace }}/vulkan"
          $tag    = "${{ env.VULKAN_TAG }}"

          git clone --depth 1 --branch $tag https://github.com/KhronosGroup/Vulkan-Headers.git vk-headers
          cmake -S vk-headers -B vk-headers/build -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --install vk-headers/build

          git clone --depth 1 --branch $tag https://github.com/KhronosGroup/Vulkan-Loader.git vk-loader
          cmake -S vk-loader -B vk-loader/build -A x64 `
                -DCMAKE_INSTALL_PREFIX="$prefix" `
                -DCMAKE_PREFIX_PATH="$prefix" `
                -DBUILD_TESTS=OFF
          cmake --build vk-loader/build --config Release --target install

          # ENABLE_OPT=OFF is the point: it drops the SPIRV-Tools dependency
          # that the packaged action tripped over. The optimiser is only used
          # for -Os style passes we do not ask for.
          git clone --depth 1 --branch $tag https://github.com/KhronosGroup/glslang.git glslang
          cmake -S glslang -B glslang/build -A x64 `
                -DCMAKE_INSTALL_PREFIX="$prefix" `
                -DENABLE_OPT=OFF `
                -DGLSLANG_TESTS=OFF `
                -DENABLE_GLSLANG_BINARIES=ON
          cmake --build glslang/build --config Release --target install

      - name: Expose Vulkan to the build
        shell: pwsh
        run: |
          $prefix = "${{ github.workspace }}/vulkan"
          "VULKAN_SDK=$prefix"              | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$prefix/bin"                     | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Get-ChildItem "$prefix/bin" | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/windows-dist/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          Get-ChildItem "C:/Program Files/Microsoft Visual Studio" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Visual Studio: $($_.Name)" }

      - name: Configure
        run: cmake --preset windows-dist

      - name: Show CMake error log on failure
        if: failure()
        run: |
          Get-ChildItem -Path build -Recurse -Include CMakeConfigureLog.yaml,CMakeError.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "=== $_ ==="; Get-Content $_ -Tail 80 }
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows-dist

      - name: Package
        working-directory: build/windows-dist
        run: cpack -C Release

      - uses: actions/upload-artifact@v7
        with:
          name: ModelViewer-windows-x86_64
          path: build/windows-dist/ModelViewer-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Checksums let anyone verify a download without trusting the transport.
      - name: Collect archives and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Linux x86_64 | `ModelViewer-*-Linux-x86_64.tar.gz` |
            | Windows x64  | `ModelViewer-*-Windows-AMD64.zip` |

            Verify with `sha256sum -c SHA256SUMS.txt`.

            ## Requirements

            A GPU and driver supporting **Vulkan 1.3**. The Vulkan loader is
            deliberately not bundled -- it belongs to your graphics driver. If
            the application reports no suitable device, update the driver first.

            Everything else (Assimp, GLFW, Dear ImGui, Draco) is linked in, and
            the C++ runtime is static, so there is no redistributable to
            install.

            ## Running it

            **Linux** -- extract and run `bin/ModelViewer`. To register it as
            the handler for 3D files and get a menu entry:

            ```bash
            bash scripts/register-file-associations.sh
            ```

            **Windows** -- extract and run `bin/ModelViewer.exe`. SmartScreen
            will warn that the publisher is unknown, because the binary is not
            code-signed; choose *More info* then *Run anyway*.
