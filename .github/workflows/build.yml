name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # GLFW needs the X11 and Wayland development headers; the Vulkan loader
      # and glslang come from the distribution rather than the LunarG SDK,
      # which is enough to build and is considerably faster to install.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libvulkan-dev vulkan-validationlayers glslang-tools spirv-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # Dependencies are fetched at configure time, so caching _deps turns a
      # ~20 minute build into a couple of minutes on unchanged pins.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/linux-dist/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset linux-dist

      - name: Build
        run: cmake --build --preset linux-dist

      - name: Package
        working-directory: build/linux-dist
        run: cpack

      - uses: actions/upload-artifact@v7
        with:
          name: ModelViewer-linux-x86_64
          path: build/linux-dist/ModelViewer-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The SDK supplies the Vulkan headers, the import library and glslc.
      # There is no distribution package equivalent on Windows.
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang
          vulkan-use-cache: true

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/windows-dist/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset windows-dist

      - name: Show CMake error log on failure
        if: failure()
        run: |
          Get-ChildItem -Path build -Recurse -Include CMakeConfigureLog.yaml,CMakeError.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "=== $_ ==="; Get-Content $_ -Tail 80 }
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows-dist

      - name: Package
        working-directory: build/windows-dist
        run: cpack -C Release

      - uses: actions/upload-artifact@v7
        with:
          name: ModelViewer-windows-x86_64
          path: build/windows-dist/ModelViewer-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Requires a GPU and driver supporting **Vulkan 1.3**.

            The Vulkan loader is not bundled: it comes from your graphics
            driver. If the application reports no suitable device, update your
            driver first.
